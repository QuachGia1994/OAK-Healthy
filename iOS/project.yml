name: OAKHealthy
compatibilityVersion: "Xcode 13.0"
options:
  bundleIdPrefix: com.phongqk
  developmentLanguage: en
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.13.0
targets:
  OAKHealthy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SupplementTrackerApp.swift
      - path: Assets.xcassets
      - path: Engine
      - path: Models
      - path: Services
      - path: Views
      - path: GoogleService-Info.plist
        buildPhase: resources
      - path: LaunchScreen.storyboard
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.phongqk.oakhealthy
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: 6.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_COMPILATION_MODE: wholemodule
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        DEAD_CODE_STRIPPING: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        STRIP_INSTALLED_PRODUCT: YES
        STRIP_SWIFT_SYMBOLS: YES
        DEPLOYMENT_POSTPROCESSING: YES
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: ""
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "OAK Healthy"
        CFBundleLocalizations:
          - en
          - vi
        NSUserNotificationsUsageDescription: "OAK Healthy cần quyền gửi thông báo để nhắc nhở bạn uống đúng giờ."
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        FirebaseCrashlyticsCollectionEnabled: false
        UIApplicationSceneManifest:
          UISceneConfigurations: {}
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseDatabase
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
    postBuildScripts:
      - name: Upload Crashlytics dSYMs
        script: |
          if [ "${CONFIGURATION}" != "Release" ] || [ "${PLATFORM_NAME}" != "iphoneos" ] || [ "${CODE_SIGNING_ALLOWED}" != "YES" ]; then
            echo "Skipping Crashlytics dSYM upload for non-store build."
            exit 0
          fi
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
        inputFiles:
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}"
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}"
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist"
          - "$(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)"
        basedOnDependencyAnalysis: false
  OAKHealthyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.phongqk.oakhealthyTests
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: ""
    dependencies:
      - target: OAKHealthy
