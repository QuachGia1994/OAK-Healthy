name: OAKHealthy
compatibilityVersion: "Xcode 13.0"
options:
  bundleIdPrefix: com.phongqk
  developmentLanguage: en
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.13.0
targets:
  OAKHealthy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    sources:
      - path: SupplementTrackerApp.swift
      - path: Assets.xcassets
      - path: Engine
      - path: Models
      - path: Services
      - path: Views
      - path: GoogleService-Info.plist
        buildPhase: resources
      - path: LaunchScreen.storyboard
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.phongqk.oakhealthy
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: 6.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_COMPILATION_MODE: wholemodule
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        DEAD_CODE_STRIPPING: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        STRIP_INSTALLED_PRODUCT: YES
        STRIP_SWIFT_SYMBOLS: YES
        DEPLOYMENT_POSTPROCESSING: YES
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "OAK Healthy"
        CFBundleLocalizations:
          - en
          - vi
        NSUserNotificationsUsageDescription: "OAK Healthy cần quyền gửi thông báo để nhắc nhở bạn uống đúng giờ."
        JSONBIN_API_KEY: "$(JSONBIN_API_KEY)"
        UIApplicationSceneManifest:
          UISceneConfigurations: {}
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseDatabase
      - package: Firebase
        product: FirebaseAppCheck
  OAKHealthyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.phongqk.oakhealthyTests
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - target: OAKHealthy
