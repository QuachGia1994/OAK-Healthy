name: OAKHealthy
compatibilityVersion: "Xcode 13.0"
options:
  bundleIdPrefix: com.example
  developmentLanguage: en
targets:
  OAKHealthy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    sources:
      - path: SupplementTrackerApp.swift
      - path: Assets.xcassets
      - path: Engine
      - path: Models
      - path: Services
      - path: Views
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.OAKHealthy
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: 6.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_COMPILATION_MODE: wholemodule
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        STRIP_INSTALLED_PRODUCT: YES
        STRIP_SWIFT_SYMBOLS: YES
        DEPLOYMENT_POSTPROCESSING: YES
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "OAK Healthy"
        CFBundleLocalizations:
          - en
          - vi
        NSUserNotificationsUsageDescription: "OAK Healthy cần quyền gửi thông báo để nhắc nhở bạn uống đúng giờ."
        JSONBIN_API_KEY: "$(JSONBIN_API_KEY)"
        UIApplicationSceneManifest:
          UISceneConfigurations: {}
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
