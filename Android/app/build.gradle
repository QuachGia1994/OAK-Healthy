plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'androidx.baselineprofile'
    id 'jacoco'
    id 'com.google.gms.google-services'
}

def properties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    properties.load(localPropertiesFile.newDataInputStream())
}
def jsonbinApiKeyRaw = properties.getProperty('JSONBIN_API_KEY', '')
def jsonbinApiKeyEscaped = jsonbinApiKeyRaw.replace('\\', '\\\\').replace('"', '\\"')

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(keystorePropertiesFile.newDataInputStream())
}

android {
    namespace 'com.example.supplementtracker'
    compileSdk 34

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties.getProperty("storeFile", "keystore.jks"))
                storePassword keystoreProperties.getProperty("storePassword", "")
                keyAlias keystoreProperties.getProperty("keyAlias", "")
                keyPassword keystoreProperties.getProperty("keyPassword", "")
            }
        }
    }

    defaultConfig {
        applicationId "com.phongqk.oakhealthy"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
        resConfigs "en", "vi"
        buildConfigField "String", "JSONBIN_API_KEY", "\"${jsonbinApiKeyEscaped}\""
        buildConfigField "String", "EXPECTED_CERT_SHA256", "\"\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '2.0.21'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    testOptions {
        unitTests.all {
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'com.google.firebase:firebase-auth:23.1.0'
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation "androidx.profileinstaller:profileinstaller:1.3.1"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.1'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3'
    implementation platform('com.google.firebase:firebase-bom:33.16.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'
    
    // Navigation
    implementation "androidx.navigation:navigation-compose:2.7.5"
    
    // Room
    def room_version = "2.6.0"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    
    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.6.2"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.06.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    baselineProfile project(":baselineprofile")
}

jacoco {
    toolVersion = "0.8.12"
}

def minCoverage = (project.findProperty("minCoverage") ?: "0.80") as BigDecimal
def jacocoCoreIncludes = [
    '**/service/CloudSyncManifest*.class',
    '**/service/CloudSyncManifest*$*.class',
    '**/service/CloudSyncPayloadCodec*.class',
    '**/service/CloudSyncPayloadCodec*$*.class'
]

tasks.register("jacocoTestReport", JacocoReport) {
    dependsOn "testDebugUnitTest"

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    def kotlinClasses = fileTree(
        dir: "$buildDir/tmp/kotlin-classes/debug",
        includes: jacocoCoreIncludes,
        excludes: ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*']
    )
    def javaClasses = fileTree(
        dir: "$buildDir/intermediates/javac/debug/classes",
        includes: jacocoCoreIncludes,
        excludes: ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*']
    )
    classDirectories.setFrom(files([kotlinClasses, javaClasses]))

    sourceDirectories.setFrom(files(["src/main/java", "src/main/kotlin"]))
    additionalSourceDirs.setFrom(files(["src/main/java", "src/main/kotlin"]))

    executionData.setFrom(fileTree(dir: "$buildDir", includes: ["jacoco/testDebugUnitTest.exec", "outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec"]))
}

tasks.register("jacocoTestCoverageVerification", JacocoCoverageVerification) {
    dependsOn "jacocoTestReport"

    def kotlinClasses = fileTree(
        dir: "$buildDir/tmp/kotlin-classes/debug",
        includes: jacocoCoreIncludes,
        excludes: ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*']
    )
    def javaClasses = fileTree(
        dir: "$buildDir/intermediates/javac/debug/classes",
        includes: jacocoCoreIncludes,
        excludes: ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*']
    )
    classDirectories.setFrom(files([kotlinClasses, javaClasses]))

    sourceDirectories.setFrom(files(["src/main/java", "src/main/kotlin"]))
    additionalSourceDirs.setFrom(files(["src/main/java", "src/main/kotlin"]))

    executionData.setFrom(fileTree(dir: "$buildDir", includes: ["jacoco/testDebugUnitTest.exec", "outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec"]))

    violationRules {
        rule {
            limit {
                counter = "LINE"
                value = "COVEREDRATIO"
                minimum = minCoverage
            }
        }
    }
}
