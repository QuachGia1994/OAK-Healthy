name: iOS Build

on:
  push:
    branches: [ main, master ]
    paths:
      - iOS/**
      - scripts/**
      - .github/workflows/ios-build.yml
  pull_request:
    branches: [ main, master ]
    paths:
      - iOS/**
      - scripts/**
      - .github/workflows/ios-build.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Paths filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          filters: |
            ios:
              - 'iOS/**'

  lint:
    name: Lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check function length (core, fail)
        run: |
          python3 scripts/check_function_length.py --max 30 --paths iOS --changed-only --fail --limit 25 \
            --include 'iOS/Services/**' \
            --include 'iOS/Engine/**' \
            --include 'iOS/Models/**'

      - name: Check function length (ui, warn)
        run: |
          python3 scripts/check_function_length.py --max 30 --paths iOS --changed-only --limit 25 \
            --include 'iOS/Views/**'

  test:
    name: Test
    needs: [changes, lint]
    runs-on: macos-15
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.ios == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Xcode (pinned)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew list xcodegen > /dev/null 2>&1 || brew install xcodegen

      - name: Inject API Keys securely
        env:
          JSONBIN_KEY: ${{ secrets.JSONBIN_API_KEY }}
        run: |
          mkdir -p iOS
          printf "JSONBIN_API_KEY = %s\n" "${JSONBIN_KEY:-}" > iOS/Secrets.xcconfig

      - name: Generate Xcode Project
        run: |
          cd iOS
          xcodegen generate

      - name: Initialize Xcode & CoreSimulator
        run: |
          sudo xcodebuild -license accept
          xcodebuild -runFirstLaunch
          xcrun simctl list devices > /dev/null || true

      - name: Select simulator
        shell: bash
        run: |
          name="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $1; exit}' | xargs)"
          if [ -z "${name}" ]; then
            name="iPhone 15"
          fi
          echo "IOS_SIMULATOR_NAME=${name}" >> "${GITHUB_ENV}"

      - name: Run Unit Tests (with coverage)
        run: |
          set -o pipefail
          rm -rf iOS/build/TestResults.xcresult
          xcodebuild -project iOS/OAKHealthy.xcodeproj -scheme OAKHealthy -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,name=${IOS_SIMULATOR_NAME}" -enableCodeCoverage YES -resultBundlePath iOS/build/TestResults.xcresult clean test | tee iOS/xcodebuild-test.log

      - name: Report Coverage (warn)
        if: ${{ always() }}
        run: |
          python3 scripts/check_xcode_coverage.py iOS/build/TestResults.xcresult --min 0.80

      - name: Upload xcresult (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: OAKHealthy-iOS-xcresult
          path: iOS/build/TestResults.xcresult
          if-no-files-found: warn

      - name: Upload xcodebuild test log (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: OAKHealthy-iOS-test-log
          path: iOS/xcodebuild-test.log
          if-no-files-found: warn

  build:
    name: Build IPA
    needs: [changes, lint, test]
    runs-on: macos-15
    timeout-minutes: 30
    if: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.ios == 'true') }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Xcode (pinned)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew list xcodegen > /dev/null 2>&1 || brew install xcodegen

      - name: Inject API Keys securely
        env:
          JSONBIN_KEY: ${{ secrets.JSONBIN_API_KEY }}
        run: |
          mkdir -p iOS
          printf "JSONBIN_API_KEY = %s\n" "$JSONBIN_KEY" > iOS/Secrets.xcconfig

      - name: Generate Xcode Project
        run: |
          cd iOS
          xcodegen generate
      
      - name: Fix malformed PBXGroup duplicates
        run: |
          python3 - <<'PY'
          import re
          from collections import defaultdict
          from pathlib import Path
          
          pbxproj_path = Path("iOS/OAKHealthy.xcodeproj/project.pbxproj")
          text = pbxproj_path.read_text(encoding="utf-8", errors="replace")
          lines = text.splitlines(keepends=True)
          
          group_blocks = []
          i = 0
          while i < len(lines):
              line = lines[i]
              m = re.match(r'^\s*([0-9A-F]{24}) /\* (.*?) \*/ = \{\s*$', line)
              if not m:
                  i += 1
                  continue
              uuid = m.group(1)
              comment = m.group(2)
              start = i
              i += 1
              isa_is_pbxgroup = False
              has_path = False
              children_start = None
              children_end = None
              children_entries = []
              while i < len(lines):
                  if re.search(r'\bisa\s*=\s*PBXGroup\s*;', lines[i]):
                      isa_is_pbxgroup = True
                  if re.search(r'^\s*path\s*=\s*', lines[i]):
                      has_path = True
                  if re.search(r'^\s*children\s*=\s*\(\s*$', lines[i]):
                      children_start = i
                      i += 1
                      while i < len(lines):
                          if re.search(r'^\s*\);\s*$', lines[i]):
                              children_end = i
                              break
                          cm = re.match(r'^\s*([0-9A-F]{24}) /\* .* \*/,\s*$', lines[i])
                          if cm:
                              children_entries.append((cm.group(1), i))
                          i += 1
                  if re.search(r'^\s*\};\s*$', lines[i]):
                      end = i
                      i += 1
                      break
                  i += 1
              
              if isa_is_pbxgroup and children_start is not None and children_end is not None:
                  group_blocks.append({
                      "uuid": uuid,
                      "comment": comment,
                      "start": start,
                      "end": end,
                      "has_path": has_path,
                      "children": children_entries,
                  })
          
          child_to_parents = defaultdict(list)
          group_by_uuid = {g["uuid"]: g for g in group_blocks}
          
          for g in group_blocks:
              for child_uuid, _line_index in g["children"]:
                  child_to_parents[child_uuid].append(g["uuid"])
          
          def pick_parent(parents):
              root_like = [p for p in parents if not group_by_uuid.get(p, {}).get("has_path", True)]
              if root_like:
                  for p in root_like:
                      if group_by_uuid.get(p, {}).get("comment") == "OAKHealthy":
                          return p
                  return root_like[0]
              for p in parents:
                  if group_by_uuid.get(p, {}).get("comment") == "OAKHealthy":
                      return p
              return parents[0]
          
          removals = defaultdict(set)  # parent_uuid -> set(child_uuid)
          for child_uuid, parents in child_to_parents.items():
              if len(parents) <= 1:
                  continue
              keep = pick_parent(parents)
              for p in parents:
                  if p != keep:
                      removals[p].add(child_uuid)
          
          if not removals:
              print("No duplicate PBXGroup memberships detected.")
              raise SystemExit(0)
          
          changed = 0
          for parent_uuid, child_uuids in removals.items():
              g = group_by_uuid.get(parent_uuid)
              if not g:
                  continue
              child_line_map = {c: idx for c, idx in g["children"]}
              for child_uuid in child_uuids:
                  idx = child_line_map.get(child_uuid)
                  if idx is not None:
                      lines[idx] = ""
                      changed += 1
          
          pbxproj_path.write_text("".join(lines), encoding="utf-8")
          print(f"Removed {changed} duplicate group-child references.")
          PY

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: iOS

      - name: Initialize Xcode & CoreSimulator
        run: |
          sudo xcodebuild -license accept
          xcodebuild -runFirstLaunch
          xcrun simctl list devices > /dev/null || true

      - name: Build iOS App with Fastlane
        working-directory: ./iOS
        run: bundle exec fastlane build
      
      - name: Dump gym log (on failure)
        if: ${{ failure() }}
        run: |
          echo "=== /Users/runner/Library/Logs/gym ==="
          ls -la /Users/runner/Library/Logs/gym || true
          echo "=== grep -nE 'error:|SwiftCompile|CompileSwift|SwiftEmitModule' OAKHealthy-OAKHealthy.log ==="
          grep -nE "error:|SwiftCompile|CompileSwift|SwiftEmitModule" /Users/runner/Library/Logs/gym/OAKHealthy-OAKHealthy.log || true
          echo "=== tail -n 600 OAKHealthy-OAKHealthy.log ==="
          tail -n 600 /Users/runner/Library/Logs/gym/OAKHealthy-OAKHealthy.log || true

      - name: Upload gym logs (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: OAKHealthy-iOS-gym-logs
          path: /Users/runner/Library/Logs/gym
          if-no-files-found: warn

      - name: Package Unsigned IPA
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: ./iOS
        run: |
          mkdir -p Payload
          cp -R build/OAKHealthy.xcarchive/Products/Applications/OAKHealthy.app Payload/
          zip -qr OAKHealthy_Unsigned.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: OAKHealthy-iOS-IPA
          path: iOS/OAKHealthy_Unsigned.ipa
          if-no-files-found: error
