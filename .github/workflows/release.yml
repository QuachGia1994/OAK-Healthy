name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ios_lane:
        type: choice
        description: iOS lane
        options:
          - beta
          - release
        default: beta
      android_track:
        type: choice
        description: Play track
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IOS_LANE: ${{ github.event.inputs.ios_lane || 'release' }}
  ANDROID_TRACK: ${{ github.event.inputs.android_track || 'production' }}

jobs:
  prepare:
    name: Determine Release Mode
    runs-on: ubuntu-latest
    outputs:
      ios_store: ${{ steps.mode.outputs.ios_store }}
      android_store: ${{ steps.mode.outputs.android_store }}
    steps:
      - name: Check required secrets (without failing)
        id: mode
        shell: bash
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          ios_ok=1
          for v in MATCH_GIT_URL MATCH_PASSWORD APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_CONTENT; do
            if [ -z "${!v}" ]; then
              ios_ok=0
            fi
          done

          android_ok=1
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!v}" ]; then
              android_ok=0
            fi
          done

          if [ "${ios_ok}" -eq 1 ]; then
            echo "ios_store=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ios_store=false" >> "${GITHUB_OUTPUT}"
          fi

          if [ "${android_ok}" -eq 1 ]; then
            echo "android_store=true" >> "${GITHUB_OUTPUT}"
          else
            echo "android_store=false" >> "${GITHUB_OUTPUT}"
          fi

  quality:
    name: Quality Gates
    uses: ./.github/workflows/quality-gates.yml
    secrets: inherit

  ios_release:
    name: iOS Release
    needs: [prepare, quality]
    if: ${{ needs.prepare.outputs.ios_store == 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Xcode (pinned)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew list xcodegen > /dev/null 2>&1 || brew install xcodegen

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: iOS

      - name: Setup SSH for match repo (optional)
        env:
          MATCH_SSH_PRIVATE_KEY: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
        if: ${{ env.MATCH_SSH_PRIVATE_KEY != '' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.MATCH_SSH_PRIVATE_KEY }}

      - name: Inject API Keys securely
        env:
          JSONBIN_KEY: ${{ secrets.JSONBIN_API_KEY }}
        run: |
          mkdir -p iOS
          printf "JSONBIN_API_KEY = %s\n" "${JSONBIN_KEY:-}" > iOS/Secrets.xcconfig

      - name: Generate Xcode Project
        run: |
          cd iOS
          xcodegen generate

      - name: Fastlane (${{ env.IOS_LANE }})
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APP_STORE_CONNECT_KEY_IS_BASE64: "true"
          IOS_APP_IDENTIFIER: ${{ secrets.IOS_APP_IDENTIFIER }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_DISABLE_COLORS: "1"
        run: |
          cd iOS
          bundle exec fastlane "${IOS_LANE}"

  ios_release_skipped:
    name: iOS Release (Skipped - Missing Secrets)
    needs: [prepare, quality]
    if: ${{ needs.prepare.outputs.ios_store != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Print instructions
        shell: bash
        run: |
          echo "Skipping iOS store release because required secrets are missing."
          echo "This also requires an Apple Developer Program membership to ship to the App Store/TestFlight."
          echo "To enable iOS store release, set secrets: MATCH_GIT_URL, MATCH_PASSWORD, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_CONTENT (and optionally MATCH_SSH_PRIVATE_KEY, IOS_APP_IDENTIFIER)."

  android_release:
    name: Android Release
    needs: [prepare, quality]
    if: ${{ needs.prepare.outputs.android_store == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create local.properties
        env:
          JSONBIN_KEY: ${{ secrets.JSONBIN_API_KEY }}
        run: |
          mkdir -p Android
          sdk_dir=""
          if [ -n "${ANDROID_SDK_ROOT}" ]; then
            sdk_dir="${ANDROID_SDK_ROOT}"
          elif [ -n "${ANDROID_HOME}" ]; then
            sdk_dir="${ANDROID_HOME}"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            sdk_dir="/usr/local/lib/android/sdk"
          fi
          if [ -z "${sdk_dir}" ]; then
            echo "Android SDK location not found (ANDROID_SDK_ROOT/ANDROID_HOME missing)."
            exit 1
          fi
          printf "sdk.dir=%s\n" "${sdk_dir}" > Android/local.properties
          printf "JSONBIN_API_KEY=%s\n" "${JSONBIN_KEY:-}" >> Android/local.properties

      - name: Setup signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > Android/keystore.jks
          printf "storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "${ANDROID_KEYSTORE_PASSWORD}" "${ANDROID_KEY_ALIAS}" "${ANDROID_KEY_PASSWORD}" > Android/keystore.properties

      - name: Build AAB (Release)
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease --stacktrace --console=plain --no-daemon --build-cache 2>&1 | tee release-build.log
        working-directory: ./Android

      - name: Upload AAB to Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.phongqk.oakhealthy
          releaseFiles: Android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ env.ANDROID_TRACK }}

      - name: Upload release log (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: OAKHealthy-Android-release-log
          path: Android/release-build.log
          if-no-files-found: warn

  android_release_skipped:
    name: Android Release (Skipped - Missing Secrets)
    needs: [prepare, quality]
    if: ${{ needs.prepare.outputs.android_store != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Print instructions
        shell: bash
        run: |
          echo "Skipping Android Play upload because required secrets are missing."
          echo "Publishing to Google Play requires a Play Console developer account."
          echo "To enable Android store release, set secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, GOOGLE_PLAY_SERVICE_ACCOUNT_JSON."
