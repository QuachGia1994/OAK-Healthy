name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ios_lane:
        type: choice
        description: iOS target
        options:
          - skip
          - beta
          - release
        default: beta
      android_track:
        type: choice
        description: Play target track
        options:
          - skip
          - internal
          - alpha
          - beta
          - production
        default: internal
      android_source_track:
        type: choice
        description: Tested Play track to promote when target is production
        options:
          - internal
          - alpha
          - beta
        default: internal
      android_rollout_fraction:
        type: choice
        description: Initial Play production rollout fraction
        options:
          - "0.1"
          - "0.25"
          - "0.5"
          - "1.0"
        default: "0.1"
      execute_store_uploads:
        type: boolean
        description: Actually upload to the selected stores; false runs readiness only
        default: false
      confirm_production:
        type: boolean
        description: Confirm a production store upload
        default: false
      build_number:
        type: string
        description: Optional monotonic store build number override; required for production
        required: false
        default: ""
      candidate_commit:
        type: string
        description: Commit SHA used to build the tested store candidate; required for production
        required: false
        default: ""
      commercial_evidence_path:
        type: string
        description: Release-specific P4 evidence JSON path; required for production
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IOS_LANE: ${{ github.event.inputs.ios_lane || 'beta' }}
  ANDROID_TRACK: ${{ github.event.inputs.android_track || 'internal' }}
  ANDROID_SOURCE_TRACK: ${{ github.event.inputs.android_source_track || 'internal' }}
  ANDROID_ROLLOUT_FRACTION: ${{ github.event.inputs.android_rollout_fraction || '0.1' }}
  EXECUTE_STORE_UPLOADS: ${{ github.event.inputs.execute_store_uploads || 'false' }}
  CONFIRM_PRODUCTION: ${{ github.event.inputs.confirm_production || 'false' }}
  STORE_BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
  CANDIDATE_COMMIT: ${{ github.event.inputs.candidate_commit || '' }}
  COMMERCIAL_EVIDENCE_PATH: ${{ github.event.inputs.commercial_evidence_path || '' }}

jobs:
  prepare:
    name: Determine Release Mode
    runs-on: ubuntu-latest
    outputs:
      ios_store: ${{ steps.mode.outputs.ios_store }}
      android_store: ${{ steps.mode.outputs.android_store }}
      candidate_version: ${{ steps.candidate.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Commercial tooling tests
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Release preflight
        run: python3 scripts/release_preflight.py

      - name: Block unconfirmed production upload
        shell: bash
        run: |
          if [ "${EXECUTE_STORE_UPLOADS}" = "true" ] && { [ "${IOS_LANE}" = "release" ] || [ "${ANDROID_TRACK}" = "production" ]; } && [ "${CONFIRM_PRODUCTION}" != "true" ]; then
            echo "Production upload requires workflow_dispatch confirm_production=true."
            exit 1
          fi

      - name: Require tested candidate and commercial evidence for production
        id: candidate
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.execute_store_uploads == 'true' && (github.event.inputs.ios_lane == 'release' || github.event.inputs.android_track == 'production') }}
        shell: bash
        run: |
          if [ -z "${{ github.event.inputs.build_number }}" ]; then
            echo "Production upload requires an explicit build_number matching the tested beta candidate."
            exit 1
          fi
          if [ -z "${CANDIDATE_COMMIT}" ]; then
            echo "Production upload requires candidate_commit from the tested beta binary."
            exit 1
          fi
          if [ -z "${COMMERCIAL_EVIDENCE_PATH}" ]; then
            echo "Production upload requires commercial_evidence_path."
            exit 1
          fi
          git rev-parse --verify "${CANDIDATE_COMMIT}^{commit}" > /dev/null
          if ! git merge-base --is-ancestor "${CANDIDATE_COMMIT}" "${GITHUB_SHA}"; then
            echo "candidate_commit must be the current commit or an ancestor of the promotion workflow commit."
            exit 1
          fi
          candidate_version="$(git show "${CANDIDATE_COMMIT}:iOS/project.yml" | awk '/MARKETING_VERSION:/ {gsub(/\"/, "", $2); print $2; exit}')"
          if [ -z "${candidate_version}" ]; then
            echo "Unable to resolve candidate marketing version from candidate_commit."
            exit 1
          fi
          echo "version=${candidate_version}" >> "${GITHUB_OUTPUT}"
          python3 scripts/commercial_gate.py \
            --evidence "${COMMERCIAL_EVIDENCE_PATH}" \
            --require production \
            --expected-version "${candidate_version}" \
            --expected-build "${STORE_BUILD_NUMBER}" \
            --expected-commit "${CANDIDATE_COMMIT}"

      - name: Check required secrets (without failing)
        id: mode
        shell: bash
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_BILLING_PUBLIC_KEY: ${{ secrets.PLAY_BILLING_PUBLIC_KEY }}
        run: |
          ios_ok=0
          if [ "${EXECUTE_STORE_UPLOADS}" = "true" ] && [ "${IOS_LANE}" != "skip" ]; then
            ios_ok=1
            for v in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_CONTENT; do
              if [ -z "${!v}" ]; then
                ios_ok=0
              fi
            done
            if [ "${IOS_LANE}" != "release" ]; then
              for v in MATCH_GIT_URL MATCH_PASSWORD; do
                if [ -z "${!v}" ]; then
                  ios_ok=0
                fi
              done
            fi
          fi

          android_ok=0
          if [ "${EXECUTE_STORE_UPLOADS}" = "true" ] && [ "${ANDROID_TRACK}" != "skip" ]; then
            android_ok=1
            if [ "${ANDROID_TRACK}" = "production" ]; then
              required_android=(GOOGLE_PLAY_SERVICE_ACCOUNT_JSON)
            else
              required_android=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON PLAY_BILLING_PUBLIC_KEY)
            fi
            for v in "${required_android[@]}"; do
              if [ -z "${!v}" ]; then
                android_ok=0
              fi
            done
          fi

          if [ "${ios_ok}" -eq 1 ]; then
            echo "ios_store=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ios_store=false" >> "${GITHUB_OUTPUT}"
          fi

          if [ "${android_ok}" -eq 1 ]; then
            echo "android_store=true" >> "${GITHUB_OUTPUT}"
          else
            echo "android_store=false" >> "${GITHUB_OUTPUT}"
          fi

  quality:
    name: Quality Gates
    uses: ./.github/workflows/quality-gates.yml
    secrets: inherit

  store_readiness_only:
    name: Store Activation Readiness Only
    needs: [prepare, quality]
    if: ${{ github.event.inputs.execute_store_uploads != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm no-upload mode
        run: |
          echo "Store upload execution is disabled."
          echo "Quality/preflight completed without contacting App Store Connect or Google Play."
          echo "Set execute_store_uploads=true only after developer accounts and required secrets are configured."

  ios_release:
    name: iOS Release
    needs: [prepare, quality]
    if: ${{ github.event.inputs.execute_store_uploads == 'true' && needs.prepare.outputs.ios_store == 'true' && github.event.inputs.ios_lane != 'skip' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Xcode (pinned)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew list xcodegen > /dev/null 2>&1 || brew install xcodegen

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: iOS

      - name: Setup SSH for match repo (optional)
        env:
          MATCH_SSH_PRIVATE_KEY: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
        if: ${{ env.MATCH_SSH_PRIVATE_KEY != '' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.MATCH_SSH_PRIVATE_KEY }}

      - name: Generate Xcode Project
        run: |
          cd iOS
          xcodegen generate

      - name: Fastlane (${{ env.IOS_LANE }})
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APP_STORE_CONNECT_KEY_IS_BASE64: "true"
          IOS_APP_IDENTIFIER: ${{ secrets.IOS_APP_IDENTIFIER }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_DISABLE_COLORS: "1"
          STORE_VERSION: ${{ needs.prepare.outputs.candidate_version }}
        run: |
          cd iOS
          bundle exec fastlane "${IOS_LANE}"

  ios_release_blocked:
    name: iOS Release (Blocked - Missing Store Credentials)
    needs: [prepare, quality]
    if: ${{ github.event.inputs.execute_store_uploads == 'true' && github.event.inputs.ios_lane != 'skip' && needs.prepare.outputs.ios_store != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Print instructions
        shell: bash
        run: |
          echo "iOS store execution was requested, but required credentials are missing."
          echo "This also requires an Apple Developer Program membership to ship to the App Store/TestFlight."
          echo "Required secrets: MATCH_GIT_URL, MATCH_PASSWORD, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_CONTENT (and optionally MATCH_SSH_PRIVATE_KEY, IOS_APP_IDENTIFIER)."
          exit 1

  android_release:
    name: Android Test-track Release
    needs: [prepare, quality]
    if: ${{ github.event.inputs.execute_store_uploads == 'true' && needs.prepare.outputs.android_store == 'true' && github.event.inputs.android_track != 'production' && github.event.inputs.android_track != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create local.properties
        env:
          JSONBIN_KEY: ${{ secrets.JSONBIN_API_KEY }}
          PLAY_BILLING_PUBLIC_KEY: ${{ secrets.PLAY_BILLING_PUBLIC_KEY }}
        run: |
          mkdir -p Android
          sdk_dir=""
          if [ -n "${ANDROID_SDK_ROOT}" ]; then
            sdk_dir="${ANDROID_SDK_ROOT}"
          elif [ -n "${ANDROID_HOME}" ]; then
            sdk_dir="${ANDROID_HOME}"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            sdk_dir="/usr/local/lib/android/sdk"
          fi
          if [ -z "${sdk_dir}" ]; then
            echo "Android SDK location not found (ANDROID_SDK_ROOT/ANDROID_HOME missing)."
            exit 1
          fi
          printf "sdk.dir=%s\n" "${sdk_dir}" > Android/local.properties
          printf "JSONBIN_API_KEY=%s\n" "${JSONBIN_KEY:-}" >> Android/local.properties
          printf "PLAY_BILLING_PUBLIC_KEY=%s\n" "${PLAY_BILLING_PUBLIC_KEY}" >> Android/local.properties

      - name: Setup signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > Android/keystore.jks
          printf "storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "${ANDROID_KEYSTORE_PASSWORD}" "${ANDROID_KEY_ALIAS}" "${ANDROID_KEY_PASSWORD}" > Android/keystore.properties

      - name: Build AAB (Release)
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease --stacktrace --console=plain --no-daemon --build-cache 2>&1 | tee release-build.log
        working-directory: ./Android

      - name: Upload AAB to Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.phongqk.oakhealthy
          releaseFiles: Android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ env.ANDROID_TRACK }}

      - name: Upload release log (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: OAKHealthy-Android-release-log
          path: Android/release-build.log
          if-no-files-found: warn

  android_production_promotion:
    name: Android Promote Tested Build
    needs: [prepare, quality]
    if: ${{ github.event.inputs.execute_store_uploads == 'true' && needs.prepare.outputs.android_store == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.android_track == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: iOS

      - name: Promote tested Play release
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          BUNDLE_GEMFILE: ${{ github.workspace }}/iOS/Gemfile
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_DISABLE_COLORS: "1"
        run: |
          key_file="$(mktemp)"
          trap 'rm -f "${key_file}"' EXIT
          printf '%s' "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" > "${key_file}"
          args=(
            supply
            --json_key "${key_file}"
            --package_name com.phongqk.oakhealthy
            --track "${ANDROID_SOURCE_TRACK}"
            --track_promote_to production
            --version_code "${STORE_BUILD_NUMBER}"
            --skip_upload_metadata true
            --skip_upload_changelogs true
            --skip_upload_images true
            --skip_upload_screenshots true
          )
          if [ "${ANDROID_ROLLOUT_FRACTION}" = "1.0" ]; then
            args+=(--track_promote_release_status completed)
          else
            args+=(--track_promote_release_status inProgress --rollout "${ANDROID_ROLLOUT_FRACTION}")
          fi
          bundle exec fastlane "${args[@]}"

  android_release_blocked:
    name: Android Release (Blocked - Missing Store Credentials)
    needs: [prepare, quality]
    if: ${{ github.event.inputs.execute_store_uploads == 'true' && github.event.inputs.android_track != 'skip' && needs.prepare.outputs.android_store != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Print instructions
        shell: bash
        run: |
          echo "Android store execution was requested, but required credentials are missing."
          echo "Publishing to Google Play requires a Play Console developer account."
          echo "Required secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, GOOGLE_PLAY_SERVICE_ACCOUNT_JSON, PLAY_BILLING_PUBLIC_KEY."
          exit 1
