name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Create local.properties
        env:
          JSONBIN_KEY: ${{ secrets.JSONBIN_API_KEY }}
        run: |
          mkdir -p Android
          sdk_dir=""
          if [ -n "${ANDROID_SDK_ROOT}" ]; then
            sdk_dir="${ANDROID_SDK_ROOT}"
          elif [ -n "${ANDROID_HOME}" ]; then
            sdk_dir="${ANDROID_HOME}"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            sdk_dir="/usr/local/lib/android/sdk"
          fi
          if [ -z "${sdk_dir}" ]; then
            echo "Android SDK location not found (ANDROID_SDK_ROOT/ANDROID_HOME missing)."
            exit 1
          fi
          printf "sdk.dir=%s\n" "${sdk_dir}" > Android/local.properties
          printf "JSONBIN_API_KEY=%s\n" "$JSONBIN_KEY" >> Android/local.properties

      - name: Build APK
        run: gradle assembleDebug
        working-directory: ./Android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: OAKHealthy-Android-APK
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
