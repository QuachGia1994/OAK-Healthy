name: Android Build

on:
  push:
    branches: [ main, master ]
    paths:
      - Android/**
      - scripts/**
      - .github/workflows/android-build.yml
  pull_request:
    branches: [ main, master ]
    paths:
      - Android/**
      - scripts/**
      - .github/workflows/android-build.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check function length (core, fail)
        run: |
          python3 scripts/check_function_length.py --max 30 --paths Android --changed-only --fail --limit 25 \
            --include 'Android/app/src/main/java/com/example/supplementtracker/service/**' \
            --include 'Android/app/src/main/java/com/example/supplementtracker/domain/**' \
            --include 'Android/app/src/main/java/com/example/supplementtracker/data/**'

      - name: Check function length (ui, warn)
        run: |
          python3 scripts/check_function_length.py --max 30 --paths Android --changed-only --limit 25 \
            --include 'Android/app/src/main/java/com/example/supplementtracker/presentation/**'

  build:
    name: Build APK
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create local.properties
        env:
          JSONBIN_KEY: ${{ secrets.JSONBIN_API_KEY }}
        run: |
          mkdir -p Android
          sdk_dir=""
          if [ -n "${ANDROID_SDK_ROOT}" ]; then
            sdk_dir="${ANDROID_SDK_ROOT}"
          elif [ -n "${ANDROID_HOME}" ]; then
            sdk_dir="${ANDROID_HOME}"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            sdk_dir="/usr/local/lib/android/sdk"
          fi
          if [ -z "${sdk_dir}" ]; then
            echo "Android SDK location not found (ANDROID_SDK_ROOT/ANDROID_HOME missing)."
            exit 1
          fi
          printf "sdk.dir=%s\n" "${sdk_dir}" > Android/local.properties
          printf "JSONBIN_API_KEY=%s\n" "$JSONBIN_KEY" >> Android/local.properties

      - name: Build APK
        run: |
          set -o pipefail
          chmod +x ./gradlew
          : > gradle-build.log
          ./gradlew :app:assembleDebug --stacktrace --console=plain --no-daemon --build-cache 2>&1 | tee gradle-build.log
        working-directory: ./Android

      - name: Dump Gradle log (on failure)
        if: ${{ failure() }}
        working-directory: ./Android
        run: |
          echo "=== tail -n 400 gradle-build.log ==="
          tail -n 400 gradle-build.log || true
          echo "=== grep -nE 'error:|e: |FAILURE:|Execution failed' gradle-build.log | tail -n 200 ==="
          grep -nE "error:|e: |FAILURE:|Execution failed" gradle-build.log | tail -n 200 || true

      - name: Upload Gradle log (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: OAKHealthy-Android-gradle-log
          path: Android/gradle-build.log
          if-no-files-found: warn

      - name: Upload APK Artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: OAKHealthy-Android-APK
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
