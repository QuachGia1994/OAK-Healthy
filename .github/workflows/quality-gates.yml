name: Quality Gates

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ format('quality-gates-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS Coverage >= 80%
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Xcode (pinned)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew list xcodegen > /dev/null 2>&1 || brew install xcodegen

      - name: Inject API Keys securely
        env:
          JSONBIN_KEY: ${{ secrets.JSONBIN_API_KEY }}
        run: |
          mkdir -p iOS
          printf "JSONBIN_API_KEY = %s\n" "${JSONBIN_KEY:-}" > iOS/Secrets.xcconfig

      - name: Generate Xcode Project
        run: |
          cd iOS
          xcodegen generate

      - name: Initialize Xcode & CoreSimulator
        run: |
          sudo xcodebuild -license accept
          xcodebuild -runFirstLaunch
          xcrun simctl list devices > /dev/null || true

      - name: Select simulator
        shell: bash
        run: |
          name="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $1; exit}' | xargs)"
          if [ -z "${name}" ]; then
            name="iPhone 15"
          fi
          echo "IOS_SIMULATOR_NAME=${name}" >> "${GITHUB_ENV}"

      - name: Run Unit Tests (with coverage)
        run: |
          set -o pipefail
          rm -rf iOS/build/TestResults.xcresult
          xcodebuild -project iOS/OAKHealthy.xcodeproj -scheme OAKHealthy -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,name=${IOS_SIMULATOR_NAME}" -enableCodeCoverage YES -resultBundlePath iOS/build/TestResults.xcresult clean test | tee iOS/xcodebuild-test.log

      - name: Enforce coverage
        run: |
          python3 scripts/check_xcode_coverage.py iOS/build/TestResults.xcresult --min 0.80 --fail \
            --include 'CloudSyncPayloadCodec.swift' \
            --include 'CloudSyncManifest.swift' \
            --include 'DoseEventKey.swift' \
            --include 'TimeStrings.swift'

      - name: Upload xcresult (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: OAKHealthy-iOS-xcresult
          path: iOS/build/TestResults.xcresult
          if-no-files-found: warn

      - name: Upload xcodebuild test log (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: OAKHealthy-iOS-test-log
          path: iOS/xcodebuild-test.log
          if-no-files-found: warn

  android:
    name: Android Coverage >= 80%
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create local.properties
        env:
          JSONBIN_KEY: ${{ secrets.JSONBIN_API_KEY }}
        run: |
          mkdir -p Android
          sdk_dir=""
          if [ -n "${ANDROID_SDK_ROOT}" ]; then
            sdk_dir="${ANDROID_SDK_ROOT}"
          elif [ -n "${ANDROID_HOME}" ]; then
            sdk_dir="${ANDROID_HOME}"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            sdk_dir="/usr/local/lib/android/sdk"
          fi
          if [ -z "${sdk_dir}" ]; then
            echo "Android SDK location not found (ANDROID_SDK_ROOT/ANDROID_HOME missing)."
            exit 1
          fi
          printf "sdk.dir=%s\n" "${sdk_dir}" > Android/local.properties
          printf "JSONBIN_API_KEY=%s\n" "${JSONBIN_KEY:-}" >> Android/local.properties

      - name: Unit Tests + Coverage Verification (>= 80%)
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :app:jacocoTestCoverageVerification -PminCoverage=0.80 --stacktrace --console=plain --no-daemon --build-cache 2>&1 | tee quality-build.log
        working-directory: ./Android

      - name: Upload quality log (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: OAKHealthy-Android-quality-log
          path: Android/quality-build.log
          if-no-files-found: warn
