name: Android Baseline Profile

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Baseline Profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create local.properties
        env:
          JSONBIN_KEY: ${{ secrets.JSONBIN_API_KEY }}
        run: |
          mkdir -p Android
          sdk_dir=""
          if [ -n "${ANDROID_SDK_ROOT}" ]; then
            sdk_dir="${ANDROID_SDK_ROOT}"
          elif [ -n "${ANDROID_HOME}" ]; then
            sdk_dir="${ANDROID_HOME}"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            sdk_dir="/usr/local/lib/android/sdk"
          fi
          if [ -z "${sdk_dir}" ]; then
            echo "Android SDK location not found (ANDROID_SDK_ROOT/ANDROID_HOME missing)."
            exit 1
          fi
          printf "sdk.dir=%s\n" "${sdk_dir}" > Android/local.properties
          printf "JSONBIN_API_KEY=%s\n" "${JSONBIN_KEY:-}" >> Android/local.properties

      - name: Generate Baseline Profile (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -o pipefail
            cd Android
            chmod +x ./gradlew
            ./gradlew :app:generateBaselineProfile --stacktrace --console=plain --no-daemon --build-cache

      - name: Upload Baseline Profile Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: OAKHealthy-Android-baseline-profile
          path: |
            Android/app/src/main/baseline-prof.txt
            Android/app/build/outputs/baselineProfiles/**
            Android/app/build/intermediates/baselineprofiles/**
          if-no-files-found: warn

